name: GPU hardening boundaries

on:
  pull_request:
    paths:
      - "native/cuda/**"
      - "web/parallel*.js"
      - "web/wgsl/frenet_parallel_scan.wgsl"
      - "web/sw.js"
      - "scripts/test_parallel_*.mjs"
      - "conformance/frenet_parallel_v1_1025.json"
      - "docs/PHASE10_PARALLEL_FRENET.md"
      - ".github/workflows/gpu-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-numerics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JavaScript source
        run: |
          node --check web/parallel-gpu.js
          node --check web/parallel-evidence.js
          node --check web/parallel.js
          node --check scripts/test_parallel_quaternion.mjs
          node --check scripts/test_parallel_rejection.mjs
      - name: Run deterministic GPU arithmetic regressions
        run: |
          node scripts/test_parallel_quaternion.mjs \
            conformance/frenet_parallel_v1_1025.json
          node scripts/test_parallel_rejection.mjs
      - name: Validate CUDA 13 UUID source boundary
        run: |
          grep -q 'const cudaUUID_t uuid = properties.uuid;' \
            native/cuda/rsh_schedule_cuda.cu
          if grep -q 'cudaDeviceGetUuid' native/cuda/rsh_schedule_cuda.cu; then
            echo 'cudaDeviceGetUuid is not a CUDA Runtime API and must not return.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          source = Path("native/cuda/rsh_schedule_cuda.cu").read_text(encoding="utf-8")
          start = source.index("std::string format_uuid")
          end = source.index("\nstd::uint64_t parse_unsigned", start)
          body = source[start:end]
          if "return output;" not in body:
              raise SystemExit("format_uuid must return its std::string directly")
          if "return output.str();" in body:
              raise SystemExit("format_uuid must not call .str() on std::string")
          PY
      - name: Validate quaternion WebGPU contract
        run: |
          grep -q 'rotation_representation' \
            conformance/frenet_parallel_v1_1025.json
          grep -q 'normalized-quaternion-xyzw-f32-v1' \
            conformance/frenet_parallel_v1_1025.json
          grep -q 'small-angle-sinc-polynomial-f32-v1' \
            conformance/frenet_parallel_v1_1025.json
          grep -q 'normalize-after-compose-and-before-emission-v1' \
            conformance/frenet_parallel_v1_1025.json
          grep -q '"transform_bytes": 32' \
            conformance/frenet_parallel_v1_1025.json
          grep -q 'fn normalize_quaternion' \
            web/wgsl/frenet_parallel_scan.wgsl
          grep -q 'fn quaternion_multiply' \
            web/wgsl/frenet_parallel_scan.wgsl
          grep -q 'fn rotate_unit_quaternion' \
            web/wgsl/frenet_parallel_scan.wgsl
          grep -q 'half_angle_squared' \
            web/wgsl/frenet_parallel_scan.wgsl
          grep -q 'half_angle_fourth / 120.0' \
            web/wgsl/frenet_parallel_scan.wgsl
          grep -q 'parallel-evidence.js' web/sw.js
      - name: Preserve evidence authority boundaries
        run: |
          grep -q 'speedup_claim: false' web/parallel-evidence.js
          grep -q 'universal_speedup_claim: false' web/parallel-evidence.js
          grep -q 'geometry_receipt_authority: false' web/parallel-evidence.js
          grep -q 'complete_path_readback: true' web/parallel-evidence.js
