name: PR14 one-shot formatter

on:
  push:
    branches:
      - agent/shard-prefix-path-reconstruction

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/shard-prefix-path-reconstruction
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rsh-parallel/src/shard_prefix.rs crates/rsh-parallel-cli/src/main.rs
          git commit -m "Format shard-prefix implementation"
          git push origin HEAD:agent/shard-prefix-path-reconstruction
