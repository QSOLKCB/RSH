name: Trusted multi-device CUDA path

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Full commit SHA already contained in main (blank = current main)"
        required: false
        default: ""
        type: string
      cuda_architectures:
        description: "Pinned CMake CUDA architecture list"
        required: true
        default: "120"
        type: string
      devices:
        description: "Two to eight unique CUDA device indices"
        required: true
        default: "0,1"
        type: string

permissions:
  contents: read

concurrency:
  group: rsh-trusted-multi-device-cuda
  cancel-in-progress: false

jobs:
  multi-device-cuda:
    # Never add pull_request, pull_request_target, issue, comment, or schedule
    # triggers to this privileged hardware workflow.
    if: github.repository == 'QSOLKCB/RSH' && github.ref == 'refs/heads/main'
    environment: rtx-hardware
    runs-on: [self-hosted, linux, x64, nvidia, cuda, multi-gpu, rsh-trusted]
    timeout-minutes: 90
    env:
      RSH_TARGET_SHA_INPUT: ${{ inputs.target_sha }}
      RSH_CUDA_ARCHITECTURES_INPUT: ${{ inputs.cuda_architectures }}
      RSH_CUDA_DEVICES_INPUT: ${{ inputs.devices }}
      RSH_EVIDENCE_DIR: artifacts/multi-device-cuda
    steps:
      - name: Check out trusted main workflow source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Enforce trusted dispatch actor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          actor = os.environ["GITHUB_ACTOR"]
          token = os.environ["GH_TOKEN"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/collaborators/{actor}/permission",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "rsh-trusted-multi-device-cuda",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)
          permission = payload.get("permission")
          if permission not in {"admin", "maintain"}:
              raise SystemExit(
                  f"dispatch actor {actor!r} has {permission!r}; admin or maintain is required"
              )
          print(f"Trusted dispatch actor: {actor} ({permission})")
          PY

      - name: Resolve accepted target commit
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main
          target="$(printf '%s' "$RSH_TARGET_SHA_INPUT" | tr 'A-F' 'a-f' | tr -d '[:space:]')"
          if [ -z "$target" ]; then
            target="$(git rev-parse refs/remotes/origin/main)"
          fi
          case "$target" in
            *[!0-9a-f]*|'')
              echo "target_sha must be hexadecimal" >&2
              exit 2
              ;;
          esac
          test "${#target}" -eq 40 || {
            echo "target_sha must be a full 40-character SHA" >&2
            exit 2
          }
          git cat-file -e "${target}^{commit}"
          git merge-base --is-ancestor "$target" refs/remotes/origin/main || {
            echo "Refusing to execute a commit not already contained in main." >&2
            exit 2
          }
          git checkout --detach "$target"
          test "$(git rev-parse HEAD)" = "$target"
          test -f scripts/test_multi_device_cuda.py
          test -f native/cuda/rsh_multi_device_path_cuda.cu
          printf 'sha=%s\n' "$target" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$target" > tested-commit.txt

      - name: Validate inputs and runner contract
        shell: bash
        run: |
          set -Eeuo pipefail
          architecture_pattern='^[0-9]+(;[0-9]+)*$'
          device_pattern='^[0-9]+(,[0-9]+){1,7}$'
          [[ "$RSH_CUDA_ARCHITECTURES_INPUT" =~ $architecture_pattern ]] || {
            echo "cuda_architectures must be numeric values separated by single semicolons" >&2
            exit 2
          }
          [[ "$RSH_CUDA_DEVICES_INPUT" =~ $device_pattern ]] || {
            echo "devices must contain two to eight comma-separated indices" >&2
            exit 2
          }
          python3 - <<'PY'
          import os

          values = [int(token) for token in os.environ["RSH_CUDA_DEVICES_INPUT"].split(",")]
          if len(values) != len(set(values)):
              raise SystemExit("devices contains duplicate indices")
          if not 2 <= len(values) <= 8:
              raise SystemExit("devices must contain two to eight indices")
          PY
          [ ! -f "$HOME/.config/rsh-gpu-agent/env" ] || \
            . "$HOME/.config/rsh-gpu-agent/env"
          for command in python3 cmake rustup cargo nvidia-smi rsh-gpu-shell; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "trusted runner command is unavailable: $command" >&2
              exit 20
            }
          done
          rm -rf "$RSH_EVIDENCE_DIR" build/multi-cuda
          mkdir -p "$RSH_EVIDENCE_DIR"
          nvidia-smi --query-gpu=index,name,compute_cap,memory.total \
            --format=csv,noheader \
            > "$RSH_EVIDENCE_DIR/nvidia-summary.txt"
          python3 - <<'PY'
          import os
          import subprocess

          selected = [int(token) for token in os.environ["RSH_CUDA_DEVICES_INPUT"].split(",")]
          result = subprocess.run(
              ["nvidia-smi", "--query-gpu=index", "--format=csv,noheader,nounits"],
              check=True,
              capture_output=True,
              text=True,
          )
          available = {int(line.strip()) for line in result.stdout.splitlines() if line.strip()}
          missing = [index for index in selected if index not in available]
          if missing:
              raise SystemExit(f"selected CUDA devices are unavailable: {missing}")
          PY

      - name: Build and execute physical multi-device CUDA audit
        id: audit
        continue-on-error: true
        env:
          TESTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p target
          cat > target/multi-device-cuda-audit.sh <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          architecture="$1"
          devices="$2"
          tested_sha="$3"
          evidence="$4"
          rm -rf build/multi-cuda "$evidence/run"
          mkdir -p "$evidence/run"

          # rsh-gpu-shell runs as the unprivileged trusted-runner user. Force
          # rustup off the image-owned /opt/rustup tree and onto the persistent,
          # writable cache mounted beneath HOME.
          export RUSTUP_HOME="$HOME/.rustup"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export PATH="$CARGO_HOME/bin:$PATH"
          mkdir -p "$RUSTUP_HOME" "$CARGO_HOME"
          for directory in "$RUSTUP_HOME" "$CARGO_HOME"; do
            probe="$directory/.rsh-write-test-$$"
            : > "$probe" || {
              echo "trusted CUDA audit directory is not writable: $directory" >&2
              exit 25
            }
            rm -f "$probe"
          done
          {
            rustup toolchain install stable --profile minimal
            rustup default stable
            rustup show active-toolchain
          } > "$evidence/rustup-setup.txt" 2>&1

          cargo build --locked --release -p rsh-parallel-cli \
            > "$evidence/cargo-build.txt" 2>&1
          cmake -S native/cpp -B build/multi-cuda \
            -DCMAKE_BUILD_TYPE=Release \
            -DRSH_ENABLE_CUDA=ON \
            -DRSH_CUDA_ARCHITECTURES="$architecture" \
            > "$evidence/cmake-configure.txt" 2>&1
          cmake --build build/multi-cuda \
            --target rsh-multi-cuda \
            --parallel "$(nproc)" \
            > "$evidence/cmake-build.txt" 2>&1
          python3 scripts/test_multi_device_cuda.py \
            --cuda-executable build/multi-cuda/rsh-multi-cuda \
            --parallel-cli target/release/rsh-parallel-cli \
            --profile conformance/frenet_multi_device_cuda_v1_4097.json \
            --devices "$devices" \
            --source-commit "$tested_sha" \
            --output-dir "$evidence/run" \
            --require-sanitizers \
            > "$evidence/harness-console.json" 2>&1
          SH
          chmod 0700 target/multi-device-cuda-audit.sh
          set +e
          rsh-gpu-shell "$PWD" bash target/multi-device-cuda-audit.sh \
            "$RSH_CUDA_ARCHITECTURES_INPUT" \
            "$RSH_CUDA_DEVICES_INPUT" \
            "$TESTED_SHA" \
            "$RSH_EVIDENCE_DIR"
          status=$?
          set -e
          printf '%s\n' "$status" > "$RSH_EVIDENCE_DIR/exit-code.txt"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record trusted workflow metadata
        if: always()
        env:
          TESTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RSH_EVIDENCE_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["RSH_EVIDENCE_DIR"])
          metadata = {
              "schema": "RSH-FRENET-MULTI-DEVICE-CUDA-WORKFLOW-METADATA-V1",
              "tested_commit": os.environ.get("TESTED_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "dispatch_actor": os.environ.get("GITHUB_ACTOR"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "cuda_architectures": os.environ.get("RSH_CUDA_ARCHITECTURES_INPUT"),
              "selected_device_indices": [
                  int(token)
                  for token in os.environ["RSH_CUDA_DEVICES_INPUT"].split(",")
              ],
              "raw_device_uuid_published": False,
              "distributed_execution": False,
              "universal_speedup_claim": False,
              "geometry_receipt_authority": False,
          }
          (evidence / "workflow-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload redacted multi-device evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RSH-multi-device-CUDA-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: artifacts/multi-device-cuda/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce accepted hardware result
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$AUDIT_STATUS" = "0" || {
            echo "Trusted multi-device CUDA evidence was rejected." >&2
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("artifacts/multi-device-cuda/run/audit.json").read_text(
                  encoding="utf-8"
              )
          )
          required = {
              "status": "PASS",
              "actual_cuda_execution": True,
              "actual_multi_device_execution": True,
              "single_host_execution": True,
              "distributed_execution": False,
              "universal_speedup_claim": False,
              "geometry_receipt_authority": False,
              "raw_device_uuid_published": False,
              "complete_path_readback": True,
          }
          for field, expected in required.items():
              if payload.get(field) is not expected and payload.get(field) != expected:
                  raise SystemExit(
                      f"trusted audit field {field}={payload.get(field)!r}, expected {expected!r}"
                  )
          PY
