name: Frenet Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  numerical-path:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Execute bounded path fuzz target
        run: cargo fuzz run frenet_path -- -max_total_time=120 -timeout=10
