name: Pages

on:
  # Automatic deployment is temporarily paused while GitHub Pages and Actions
  # are degraded. Keep manual dispatch available for an explicit recovery test.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test and build portable WASM modules
        uses: ./.github/actions/build-wasm
      - name: Execute browser conformance profiles
        run: |
          OUT="${RUNNER_TEMP:-$PWD/target/pages-conformance}"
          mkdir -p "$OUT"

          wasm=target/wasm32-unknown-unknown/release/rsh_wasm.wasm
          node scripts/test_wasm.mjs "$wasm" conformance/wasm_v2_129.json

          numerical_wasm=target/wasm32-unknown-unknown/release/rsh_numerics_wasm.wasm
          node scripts/test_frenet_path.mjs \
            "$numerical_wasm" \
            conformance/frenet_path_v1_1025.json

          cargo run --locked -p rsh-parallel-cli -- \
            run --samples 1025 --json "$OUT/rsh_parallel_native.json"
          parallel_wasm=target/wasm32-unknown-unknown/release/rsh_parallel_wasm.wasm
          node scripts/test_parallel_frenet.mjs \
            "$parallel_wasm" \
            conformance/frenet_parallel_v1_1025.json \
            "$OUT/rsh_parallel_native.json"

          python3 rsh_runner.py tissue --json "$OUT/rsh_tissue_python.json"
          python3 scripts/verify_tissue_goldens.py \
            --profile conformance/tissue_v1_8x20.json \
            --report "$OUT/rsh_tissue_python.json"
          cargo run --locked -p rsh-tissue-cli -- \
            run --json "$OUT/rsh_tissue_rust.json"
          tissue_wasm=target/wasm32-unknown-unknown/release/rsh_tissue_wasm.wasm
          node scripts/test_tissue_wasm.mjs \
            "$tissue_wasm" \
            conformance/tissue_v1_8x20.json \
            "$OUT/rsh_tissue_python.json" \
            "$OUT/rsh_tissue_rust.json"
      - name: Assemble Pages artifact
        run: |
          mkdir -p web/pkg
          cp target/wasm32-unknown-unknown/release/rsh_wasm.wasm web/pkg/rsh_wasm.wasm
          cp target/wasm32-unknown-unknown/release/rsh_numerics_wasm.wasm \
            web/pkg/rsh_numerics_wasm.wasm
          cp target/wasm32-unknown-unknown/release/rsh_parallel_wasm.wasm \
            web/pkg/rsh_parallel_wasm.wasm
          cp target/wasm32-unknown-unknown/release/rsh_tissue_wasm.wasm \
            web/pkg/rsh_tissue_wasm.wasm
      - name: Validate Pages artifact
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/gpu.css
          test -s web/app.js
          test -s web/gpu.js
          test -s web/frenet.html
          test -s web/frenet.css
          test -s web/frenet.js
          test -s web/path-gpu.js
          test -s web/parallel.html
          test -s web/parallel.css
          test -s web/parallel.js
          test -s web/parallel-gpu.js
          test -s web/tissue.html
          test -s web/tissue.css
          test -s web/tissue.js
          test -s web/sw.js
          test -s web/wgsl/kappa_tau_field.wgsl
          test -s web/wgsl/frenet_path.wgsl
          test -s web/wgsl/frenet_parallel_scan.wgsl
          test -s web/pkg/rsh_wasm.wasm
          test -s web/pkg/rsh_numerics_wasm.wasm
          test -s web/pkg/rsh_parallel_wasm.wasm
          test -s web/pkg/rsh_tissue_wasm.wasm
          test -s conformance/wasm_v2_129.json
          test -s conformance/wgsl_v1_4096.json
          test -s conformance/frenet_path_v1_1025.json
          test -s conformance/frenet_parallel_v1_1025.json
          test -s conformance/tissue_v1_8x20.json
          test -s scripts/test_wasm.mjs
          test -s scripts/test_frenet_path.mjs
          test -s scripts/test_parallel_frenet.mjs
          test -s scripts/test_tissue_wasm.mjs
          test -s scripts/verify_tissue_goldens.py
          test -s .github/actions/build-wasm/action.yml
          test -f web/.nojekyll
          node --check web/app.js
          node --check web/gpu.js
          node --check web/frenet.js
          node --check web/path-gpu.js
          node --check web/parallel.js
          node --check web/parallel-gpu.js
          node --check web/tissue.js
          node --check web/sw.js
          grep -q '<title>RSH' web/index.html
          grep -q '<title>RSH Full Frenet Path Research</title>' web/frenet.html
          grep -q '<title>RSH Parallel Frenet Research</title>' web/parallel.html
          grep -q '<title>RSH Rust/WASM Tissue Laboratory</title>' web/tissue.html
          grep -q 'VERIFIED RUST/WASM SAMPLES' web/index.html
          grep -q 'PHASE 4 · WEBGPU RESIDUAL HARNESS' web/index.html
          grep -q 'pkg/rsh_wasm.wasm' web/app.js
          grep -q 'pkg/rsh_numerics_wasm.wasm' web/frenet.js
          grep -q 'pkg/rsh_parallel_wasm.wasm' web/parallel.js
          grep -q 'pkg/rsh_tissue_wasm.wasm' web/tissue.js
          grep -q 'wgsl/kappa_tau_field.wgsl' web/sw.js
          grep -q 'wgsl/frenet_path.wgsl' web/sw.js
          grep -q 'wgsl/frenet_parallel_scan.wgsl' web/sw.js
          grep -q 'pkg/rsh_parallel_wasm.wasm' web/sw.js
          test "$(od -An -t x1 -N4 web/pkg/rsh_wasm.wasm | tr -d ' \n')" = "0061736d"
          test "$(od -An -t x1 -N4 web/pkg/rsh_numerics_wasm.wasm | tr -d ' \n')" = "0061736d"
          test "$(od -An -t x1 -N4 web/pkg/rsh_parallel_wasm.wasm | tr -d ' \n')" = "0061736d"
          test "$(od -An -t x1 -N4 web/pkg/rsh_tissue_wasm.wasm | tr -d ' \n')" = "0061736d"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
