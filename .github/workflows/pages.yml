name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/rsh-core/**"
      - "crates/rsh-wasm/**"
      - "crates/rsh-numerics/**"
      - "crates/rsh-numerics-wasm/**"
      - "conformance/**"
      - "scripts/test_wasm.mjs"
      - "scripts/test_frenet_path.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust WASM target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Test WASM bridges
        run: cargo test --locked -p rsh-wasm -p rsh-numerics-wasm
      - name: Build browser modules
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown \
            -p rsh-wasm -p rsh-numerics-wasm
      - name: Execute browser conformance profiles
        run: |
          wasm=target/wasm32-unknown-unknown/release/rsh_wasm.wasm
          node scripts/test_wasm.mjs "$wasm" conformance/wasm_v2_129.json
          numerical_wasm=target/wasm32-unknown-unknown/release/rsh_numerics_wasm.wasm
          node scripts/test_frenet_path.mjs \
            "$numerical_wasm" \
            conformance/frenet_path_v1_1025.json
      - name: Assemble Pages artifact
        run: |
          mkdir -p web/pkg
          cp target/wasm32-unknown-unknown/release/rsh_wasm.wasm web/pkg/rsh_wasm.wasm
          cp target/wasm32-unknown-unknown/release/rsh_numerics_wasm.wasm \
            web/pkg/rsh_numerics_wasm.wasm
      - name: Validate Pages artifact
        run: |
          test -s web/index.html
          test -s web/style.css
          test -s web/gpu.css
          test -s web/app.js
          test -s web/gpu.js
          test -s web/frenet.html
          test -s web/frenet.css
          test -s web/frenet.js
          test -s web/path-gpu.js
          test -s web/sw.js
          test -s web/wgsl/kappa_tau_field.wgsl
          test -s web/wgsl/frenet_path.wgsl
          test -s web/pkg/rsh_wasm.wasm
          test -s web/pkg/rsh_numerics_wasm.wasm
          test -s conformance/wasm_v2_129.json
          test -s conformance/wgsl_v1_4096.json
          test -s conformance/frenet_path_v1_1025.json
          test -s scripts/test_wasm.mjs
          test -s scripts/test_frenet_path.mjs
          test -f web/.nojekyll
          node --check web/app.js
          node --check web/gpu.js
          node --check web/frenet.js
          node --check web/path-gpu.js
          node --check web/sw.js
          grep -q '<title>RSH' web/index.html
          grep -q '<title>RSH Full Frenet Path Research</title>' web/frenet.html
          grep -q 'VERIFIED RUST/WASM SAMPLES' web/index.html
          grep -q 'PHASE 4 · WEBGPU RESIDUAL HARNESS' web/index.html
          grep -q 'pkg/rsh_wasm.wasm' web/app.js
          grep -q 'pkg/rsh_numerics_wasm.wasm' web/frenet.js
          grep -q 'wgsl/kappa_tau_field.wgsl' web/sw.js
          grep -q 'wgsl/frenet_path.wgsl' web/sw.js
          test "$(od -An -t x1 -N4 web/pkg/rsh_wasm.wasm | tr -d ' \n')" = "0061736d"
          test "$(od -An -t x1 -N4 web/pkg/rsh_numerics_wasm.wasm | tr -d ' \n')" = "0061736d"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
