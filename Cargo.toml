[workspace]
members = [
  "crates/rsh-core",
  "crates/rsh-cli",
  "crates/rsh-wasm",
  "crates/rsh-ffi",
  "crates/rsh-governance",
  "crates/rsh-numerics",
  "crates/rsh-numerics-cli",
  "crates/rsh-numerics-wasm",
  "crates/rsh-parallel",
  "crates/rsh-parallel-cli",
  "crates/rsh-parallel-wasm",
  "crates/rsh-tissue",
  "crates/rsh-tissue-cli",
  "crates/rsh-tissue-wasm",
]
resolver = "2"

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/QSOLKCB/RSH"
authors = ["Dr. J. Robitaille", "Trent Slade / QSOL-IMC"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
