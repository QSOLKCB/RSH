[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsh-geometry"
version = "2.0.0"
description = "Bounded Frenet-Serret geometry and deterministic evidence for the Robitaille-Slade Helix"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MPL-2.0"}
authors = [
  {name = "J. Robitaille"},
  {name = "Trent Slade", email = "qsolimc@users.noreply.github.com"},
]
keywords = ["geometry", "frenet-serret", "deterministic", "verification", "helix"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
rsh = "rsh.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
